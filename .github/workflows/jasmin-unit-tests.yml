on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - jasmin
jobs:
  unit-tests-jasmin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: |
            python -m pip install --upgrade pip
            pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
            pip install microsoft-aurora==1.8.0 xarray==2026.4.0 netcdf4==1.7.4 dask==2026.3.0 hypothesis
      - name: Run tests
        working-directory: jasmin
        run: |
            python -m unittest discover -s tests -p 'test_*.py'
